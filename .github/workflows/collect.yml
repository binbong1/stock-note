name: 주식 데이터 수집

on:
  schedule:
    # 평일 16:40 (한국시간) = 07:40 UTC. 국내 장 마감 후 실행
    - cron: '40 7 * * 1-5'
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 실행 위치 확인 (윈도우 PC가 맡고 있으면 건너뜀)
        id: mode
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && grep -q '"mode": *"local"' config/runner.json 2>/dev/null; then
            echo "윈도우 PC가 실행 중이라 건너뛰어요"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.skip != '1'
        with:
          node-version: 22

      - name: 시세·지표·공시 수집
        if: steps.mode.outputs.skip != '1'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          HOLDINGS_PASSWORD: ${{ secrets.HOLDINGS_PASSWORD }}
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          KIS_APPKEY_2: ${{ secrets.KIS_APPKEY_2 }}
          KIS_APPSECRET_2: ${{ secrets.KIS_APPSECRET_2 }}
          KIS_ACCOUNT_2: ${{ secrets.KIS_ACCOUNT_2 }}
          KIS_APPKEY_3: ${{ secrets.KIS_APPKEY_3 }}
          KIS_APPSECRET_3: ${{ secrets.KIS_APPSECRET_3 }}
          KIS_ACCOUNT_3: ${{ secrets.KIS_ACCOUNT_3 }}
        run: node scripts/collect.mjs

      - name: 결과 저장(커밋)
        if: steps.mode.outputs.skip != '1'
        run: |
          git config user.name "stock-note-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
