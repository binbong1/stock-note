name: 신용잔고 알림

on:
  schedule:
    # 평일 16:30 (한국시간) = 07:30 UTC
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 보낸 날짜여도 다시 보내기'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  credit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 실행 위치 확인 (윈도우 PC가 맡고 있으면 건너뜀)
        id: mode
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && grep -q '"mode": *"local"' config/runner.json 2>/dev/null; then
            echo "윈도우 PC가 실행 중이라 건너뛰어요"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.skip != '1'
        with:
          node-version: 22
      - name: 신용잔고 그래프 보내기
        if: steps.mode.outputs.skip != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/credit.mjs ${{ inputs.force && '--force' || '' }}
      - name: 기록 저장(커밋)
        if: steps.mode.outputs.skip != '1'
        run: |
          git config user.name "stock-note-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/credit.json
          if ! git diff --cached --quiet; then git commit -m "신용잔고 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"; git pull --rebase; git push; fi
