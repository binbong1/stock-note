name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env: { K: "${{ secrets.DART_API_KEY }}" }
        run: |
          cat > p.mjs <<'JS'
          const K = process.env.K, cc = '00151711';
          const corp = process.argv[2];
          const get = async (u) => (await fetch(u)).json();
          const out = { fin: {}, div: {}, q: null };
          for (const y of [2025, 2022, 2019]) {
            const j = await get(`https://opendart.fss.or.kr/api/fnlttSinglAcnt.json?crtfc_key=${K}&corp_code=${corp}&bsns_year=${y}&reprt_code=11011`);
            out.fin[y] = { status: j.status, msg: j.message, rows: (j.list || []).filter((r) => ['매출액','영업이익','당기순이익','당기순이익(손실)','법인세차감전 순이익','자산총계','부채총계','자본총계'].includes(r.account_nm)).map((r) => [r.fs_div, r.account_nm, r.thstrm_nm, r.thstrm_amount, r.frmtrm_nm, r.frmtrm_amount, r.bfefrmtrm_nm, r.bfefrmtrm_amount]) };
            const d = await get(`https://opendart.fss.or.kr/api/alotMatter.json?crtfc_key=${K}&corp_code=${corp}&bsns_year=${y}&reprt_code=11011`);
            out.div[y] = { status: d.status, msg: d.message, rows: (d.list || []).map((r) => [r.se, r.stock_knd, r.thstrm, r.frmtrm, r.lwfr]) };
          }
          const q = await get(`https://opendart.fss.or.kr/api/fnlttSinglAcnt.json?crtfc_key=${K}&corp_code=${corp}&bsns_year=2026&reprt_code=11014`);
          out.q = { status: q.status, rows: (q.list || []).filter((r) => ['매출액','영업이익','당기순이익','당기순이익(손실)'].includes(r.account_nm)).map((r) => [r.fs_div, r.account_nm, r.thstrm_nm, r.thstrm_amount, r.thstrm_add_amount, r.frmtrm_add_amount]) };
          console.log(JSON.stringify(out));
          JS
          node p.mjs 00134477
