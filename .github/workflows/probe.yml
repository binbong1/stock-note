name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const UA = { 'User-Agent': 'Mozilla/5.0', 'Content-Type': 'application/json; charset=UTF-8', Referer: 'https://freesis.kofia.or.kr/' };
          for (const obj of ['STATSCU0100000070BO', 'STATSCU0100000060BO']) {
            try {
              const r = await fetch('https://freesis.kofia.or.kr/meta/getMetaDataList.do', { method: 'POST', headers: UA, signal: AbortSignal.timeout(20000),
                body: JSON.stringify({ dmSearch: { tmpV40: '1000000', tmpV41: '1', tmpV1: 'D', tmpV45: '20261020', tmpV46: '20261113', OBJ_NM: obj } }) });
              const t = await r.text();
              console.log('KOFIA', obj, r.status, t.slice(0, 1500));
            } catch (e) { console.log('KOFIA fail', obj, e.message); }
          }
          try {
            const r = await fetch('https://finance.naver.com/sise/sise_deposit.naver', { headers: { 'User-Agent': 'Mozilla/5.0' }, signal: AbortSignal.timeout(20000) });
            const b = Buffer.from(await r.arrayBuffer());
            const t = new TextDecoder('euc-kr').decode(b);
            const i = t.indexOf('신용잔고');
            console.log('NAVER', r.status, t.replace(/\s+/g, ' ').slice(t.replace(/\s+/g, ' ').indexOf('신용잔고') - 200, t.replace(/\s+/g, ' ').indexOf('신용잔고') + 1500));
          } catch (e) { console.log('NAVER fail', e.message); }
          try {
            const r = await fetch('https://quickchart.io/chart', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ width: 400, height: 200, format: 'png', chart: { type: 'line', data: { labels: [1, 2], datasets: [{ data: [1, 2] }] } } }) });
            console.log('QUICKCHART', r.status, r.headers.get('content-type'), (await r.arrayBuffer()).byteLength);
          } catch (e) { console.log('QC fail', e.message); }
          JS
          node p.mjs
