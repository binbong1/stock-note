<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 주식 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F6F3;--card:#FFF;--line:#E4E4DF;--line2:#EFEFEA;--ink:#16161A;--ink2:#3D3D45;--mute:#5C5C66;--up:#C8102E;--down:#1D4ED8;--ma20:#E8590C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans KR',system-ui,sans-serif}
  a{color:#1F3A8A;text-decoration:none}a:hover{text-decoration:underline}
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}
  header{background:#fff;border-bottom:1px solid var(--line)}
  .wrap{max-width:1320px;margin:0 auto;padding:0 32px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding:16px 0}
  .logo{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;font-size:18px}
  .logo span.mark{width:32px;height:32px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center}
  nav{display:flex;flex-wrap:wrap;gap:4px}
  nav a{padding:10px 14px;border-radius:8px;color:var(--ink2);font-weight:500}
  nav a.on{background:var(--ink);color:#fff;font-weight:600}
  nav a:hover{text-decoration:none;background:#EDEDE8}nav a.on:hover{background:var(--ink)}
  main{padding:28px 0 48px;display:flex;flex-direction:column;gap:24px}
  h1{margin:0;font-size:28px;letter-spacing:-.5px}
  h2{margin:0;font-size:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .kpi .l{color:var(--mute);font-size:13px;font-weight:500}.kpi .v{font-size:28px;font-weight:600;margin-top:6px}.kpi .s{font-size:13px;margin-top:4px}
  .kpi.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.kpi.dark .l,.kpi.dark .s{color:#C9C9D1}
  .row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
  .main-col{flex:999 1 640px;min-width:0}.side-col{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:24px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{color:var(--mute);font-weight:500;padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  td{padding:12px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  tr:last-child td{border-bottom:none}
  .name{color:var(--ink);font-weight:600}.sub{color:#6B6B75;font-size:12px}
  .tag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#EDEDE8;color:var(--ink2)}
  .tag.breakout,.tag.up{background:#FDE8EB;color:#9B0D24}.tag.near-stop,.tag.stop{background:#E3EBFD;color:#173EA5}
  .sig{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:#FBF3F4}
  .sig.blue{background:#F1F4FC}.dot{width:8px;height:8px;border-radius:50%;background:var(--up);margin-top:7px;flex:none}.sig.blue .dot{background:var(--down)}
  .list{list-style:none;margin:0;padding:0}.list li{padding:10px 0;border-bottom:1px solid var(--line2)}.list li:last-child{border:none}
  input,textarea{font:inherit;border:1px solid #D6D6CF;border-radius:10px;background:#FAFAF8;padding:0 12px;height:40px}
  textarea{width:100%;height:auto;padding:12px 14px;resize:vertical}
  input.small{width:110px;text-align:right}
  button{font:inherit;height:44px;padding:0 18px;border-radius:10px;border:1px solid #D6D6CF;background:#fff;color:var(--ink2);cursor:pointer}
  button.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .banner{padding:10px 14px;border-radius:10px;background:#FFF4E5;color:#8A4B00;font-size:14px}
  .banner.err{background:#FDECEC;color:#8B1A1A}
  .bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 32px}
  .track{height:10px;background:var(--line2);border-radius:5px;margin-top:6px}.fill{height:10px;border-radius:5px}
  .check{display:flex;gap:10px;align-items:flex-start}.check svg{flex:none;margin-top:2px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink2)}.legend i{display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle}
  #pop{position:fixed;z-index:50;width:560px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:16px 18px;display:none}
  #pop .pm{display:grid;grid-template-columns:auto auto;gap:5px 18px;font-size:13px;align-content:start}
  #pop .pm span:nth-child(odd){color:var(--mute)} #pop .pm span:nth-child(even){text-align:right;font-weight:600;font-family:'IBM Plex Mono',monospace}
  a.popname{color:var(--ink);font-weight:600} a.popname:hover{color:#5B3FD6;text-decoration:none}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{height:34px;padding:0 12px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 24px}
  .kv div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line2);padding:6px 0;font-size:14px}.kv div span:first-child{color:var(--mute)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:640px){.wrap{padding:0 16px}h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="#/"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></span>내 주식 노트</a>
  <nav aria-label="주 메뉴"><a href="#/" id="nav-home">대시보드</a><a href="#/history" id="nav-hist">자산 추이</a><a href="#/realized" id="nav-real">실현손익</a><a href="#/signals" id="nav-sig">매매 신호</a><a href="#/holdings" id="nav-hold">보유 정보</a></nav>
</div></header>
<div id="pop" role="dialog" aria-live="polite"></div>
<div class="wrap"><main id="app"><p class="mute">불러오는 중…</p></main></div>

<script>
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const fmt = (v, cur) => v == null ? '–' : cur === 'USD' ? '$' + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : Math.round(v).toLocaleString('ko-KR');
const won = (v) => v == null ? '–' : Math.round(v).toLocaleString('ko-KR');
const sign = (v, unit = '%') => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + unit;
const signWon = (v) => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.round(Math.abs(v)).toLocaleString('ko-KR');
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'down' : '';
let SIG = null, ENC_F = null, FLOWS = null;
let DATA = null, ENC = null, AUTO = null, ENC_H = null, ENC_R = null, HIST = null, REAL = null;

const b64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
async function decryptBox(box, pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(box.salt), iterations: box.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function savedPw() { try { return sessionStorage.getItem('stocknote.pw') || localStorage.getItem('stocknote.pw'); } catch { return null; } }
async function unlock(pw, remember) {
  AUTO = await decryptBox(ENC, pw);
  HIST = ENC_H ? await decryptBox(ENC_H, pw) : null;
  REAL = ENC_R ? await decryptBox(ENC_R, pw) : null;
  FLOWS = ENC_F ? await decryptBox(ENC_F, pw).catch(() => null) : null;
  try { (remember ? localStorage : sessionStorage).setItem('stocknote.pw', pw); } catch {}
}
function lockCard() {
  if (!ENC || AUTO) return '';
  return `<section class="card" aria-labelledby="lk"><form id="unlock" style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px">
    <div style="flex:1 1 260px"><h2 id="lk">증권사 잔고 잠금 해제</h2><p class="mute" style="margin:2px 0 0;font-size:13px">키움·한국투자증권에서 자동으로 가져온 보유 수량과 평단은 암호화돼 있어요.</p></div>
    <div><label for="pw" style="display:block;font-size:13px;color:var(--mute)">비밀번호</label><input id="pw" type="password" autocomplete="current-password" style="height:44px;width:200px"></div>
    <label style="display:flex;align-items:center;gap:6px;font-size:14px;height:44px"><input id="rem" type="checkbox" style="height:auto"> 이 기기에서 기억</label>
    <button class="primary" type="submit">열기</button><span id="lkmsg" class="down" style="font-size:13px"></span></form></section>`;
}
function bindLock() {
  const f = document.getElementById('unlock'); if (!f) return;
  f.onsubmit = async (e) => {
    e.preventDefault();
    try { await unlock(document.getElementById('pw').value, document.getElementById('rem').checked); route(); }
    catch { document.getElementById('lkmsg').textContent = '비밀번호가 맞지 않아요'; }
  };
}
function lockOut() { try { sessionStorage.removeItem('stocknote.pw'); localStorage.removeItem('stocknote.pw'); } catch {} AUTO = null; HIST = null; REAL = null; route(); }

// ---------- 계좌 선택 (전체 / 계좌별) ----------
let ACCTS = (() => { const v = store.get('stocknote.accts', null); if (Array.isArray(v)) return v; const old = store.get('stocknote.acct', 'all'); return old && old !== 'all' ? [old] : []; })();
let ACCT = 'all';   // 호환용: 'all' 이거나 계좌 하나일 때 그 키 (여러 개 선택이면 'multi')
const acctKey = (broker, account) => `${broker}|${account || broker}`;
function isAll() { const list = accountList(); return !ACCTS.length || list.every((k) => ACCTS.includes(k)); }
function inAcct(key) { return isAll() || ACCTS.includes(key); }
function syncAcct() { ACCT = isAll() ? 'all' : ACCTS.length === 1 ? ACCTS[0] : 'multi'; }
function selName() { return isAll() ? '전체' : accountList().filter((k) => ACCTS.includes(k)).map(acctName).join(' + '); }
function acctName(key) { const al = AUTO?.aliases?.[key] || HIST?.aliases?.[key]; if (al) return al; const [b, a] = key.split('|'); return String(a).startsWith(b) ? a : (b === 'KIS' ? '한투 ' : b + ' ') + a; }
function accountList() {
  const keys = new Set();
  (AUTO?.items || []).forEach((h) => keys.add(acctKey(h.broker, h.account)));
  (AUTO?.accounts || []).forEach((a) => keys.add(acctKey(a.broker, a.account)));
  (REAL?.rows || []).forEach((r) => keys.add(acctKey(r.broker, r.account)));
  Object.keys(HIST?.days?.at(-1)?.byAccount || {}).forEach((k) => keys.add(k));
  return [...keys].sort((a, b) => acctName(a).localeCompare(acctName(b), 'ko'));
}
function acctBar() {
  if (!AUTO) return '';
  const list = accountList();
  if (list.length < 2) return '';
  ACCTS = ACCTS.filter((k) => list.includes(k)); syncAcct();
  const all = isAll();
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center" role="group" aria-label="계좌 선택 (여러 개 선택 가능)">
    <span class="mute" style="font-size:13px;margin-right:4px">계좌</span>
    <button type="button" data-acct-all class="${all ? 'primary' : ''}" style="height:36px">전체</button>
    ${list.map((k) => { const on = !all && ACCTS.includes(k); return `<label style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid ${on ? 'var(--ink)' : '#D6D6CF'};border-radius:10px;background:${on ? '#16161A' : '#fff'};color:${on ? '#fff' : 'var(--ink2)'};cursor:pointer;font-size:14px;user-select:none"><input type="checkbox" data-acct-chk="${esc(k)}" ${on ? 'checked' : ''} style="height:auto;width:16px;margin:0;accent-color:#fff">${esc(acctName(k))}</label>`; }).join('')}
    ${!all && ACCTS.length > 1 ? `<span class="mute" style="font-size:13px">${ACCTS.length}개 계좌 합계</span>` : ''}
  </div>`;
}
function setAccts(v) { ACCTS = v; store.set('stocknote.accts', ACCTS); syncAcct(); route(); }
function bindAcct() {
  document.querySelectorAll('[data-acct-all]').forEach((b) => b.onclick = () => setAccts([]));
  document.querySelectorAll('[data-acct-chk]').forEach((c) => c.onchange = () => {
    const k = c.dataset.acctChk, list = accountList();
    let cur = isAll() ? [] : [...ACCTS];
    cur = c.checked ? [...new Set([...cur, k])] : cur.filter((x) => x !== k);
    if (cur.length >= list.length) cur = [];   // 모두 고르면 '전체'와 같음
    setAccts(cur);
  });
  // 계좌별 현황 표·토스 묶음의 계좌 버튼: 그 계좌 하나만 선택
  document.querySelectorAll('[data-acct]').forEach((b) => b.onclick = () => setAccts([b.dataset.acct]));
}

function holdings() {
  const manual = store.get('stocknote.holdings', {});
  if (!AUTO) return manual;
  const out = {};
  for (const h of AUTO.items) {
    if (h.self) continue;   // 토스 등 증권사 시세 종목은 portfolio()에서 따로 처리
    if (!inAcct(acctKey(h.broker, h.account))) continue;
    const o = out[h.code] ||= { qty: 0, cost: 0, brokers: [] };
    o.qty += h.qty; o.cost += h.qty * h.avg;
    if (!o.brokers.includes(h.broker)) o.brokers.push(h.broker);
  }
  for (const k in out) { out[k].avg = out[k].qty ? out[k].cost / out[k].qty : 0; out[k].auto = true; }
  if (isAll()) for (const k in manual) if (!out[k]) out[k] = manual[k];
  return out;
}
function toKRW(s, v) { return s.currency === 'USD' ? v * (DATA.fx.USDKRW || 0) : v; }

function portfolio() {
  const h = holdings();
  let value = 0, cost = 0, today = 0, any = false;
  const rows = DATA.stocks.map((s) => {
    const p = h[s.code] || {};
    const qty = +p.qty || 0, avg = +p.avg || 0;
    const v = toKRW(s, s.close * qty), c = toKRW(s, avg * qty);
    const prevClose = s.close / (1 + s.changePct / 100);
    if (qty) { any = true; value += v; cost += c; today += toKRW(s, (s.close - prevClose) * qty); }
    return { s, qty, avg, value: v, cost: c, brokers: p.brokers, ret: qty && avg ? (s.close / avg - 1) * 100 : null };
  });
  // 토스(주식모으기) 등 self 종목: 전체 보기에서는 한 줄로 묶고, 해당 계좌를 고르면 종목별로
  const selfItems = (AUTO?.items || []).filter((h) => h.self && inAcct(acctKey(h.broker, h.account)));
  const dayPl = (h) => (h.dailyRate != null ? h.valueKrw - h.valueKrw / (1 + h.dailyRate / 100) : 0);
  // 토스 계좌 하나만 골랐을 때만 종목별로, 여러 계좌를 합쳐 볼 때는 한 줄로 묶음
  if (selfItems.length && !(ACCTS.length === 1 && !isAll())) {
    const groups = {};
    for (const h of selfItems) (groups[acctKey(h.broker, h.account)] ||= []).push(h);
    for (const [k, list] of Object.entries(groups)) {
      const v = list.reduce((t, h) => t + (h.valueKrw || 0), 0), c = list.reduce((t, h) => t + (h.costKrw || 0), 0), td = list.reduce((t, h) => t + dayPl(h), 0);
      rows.push({ s: { code: '__group', name: (acctName(k) === '토스' ? '토스' : acctName(k)) + ' 주식모으기', currency: 'KRW', changePct: v ? td / (v - td) * 100 : null }, group: k, n: list.length, qty: list.length, avg: null, value: v, cost: c, ret: c ? (v / c - 1) * 100 : null });
      any = true; value += v; cost += c; today += td;
    }
  } else {
    for (const h of selfItems) {
      rows.push({ s: { code: h.code, name: h.name, close: h.price, currency: h.currency, changePct: h.dailyRate }, qty: h.qty, avg: h.avg, value: h.valueKrw, cost: h.costKrw, ret: h.costKrw ? (h.valueKrw / h.costKrw - 1) * 100 : null, brokers: [h.broker] });
      any = true; value += h.valueKrw || 0; cost += h.costKrw || 0; today += dayPl(h);
    }
  }
  rows.forEach((r) => r.weight = value && r.qty ? r.value / value * 100 : null);
  // 예수금 (선택한 계좌 기준)
  let cash = null;
  for (const a of AUTO?.accounts || []) {
    if (!inAcct(acctKey(a.broker, a.account))) continue;
    if (a.cash != null) cash = (cash || 0) + a.cash;
  }
  return { rows, value, cost, today, any, cash };
}

function accountSummary() {
  if (!AUTO || (!isAll() && ACCTS.length < 2)) return '';
  const px = Object.fromEntries(DATA.stocks.map((s) => [s.code, s]));
  const acc = {};
  for (const h of AUTO.items) {
    if (!inAcct(acctKey(h.broker, h.account))) continue;
    if (h.self) {
      const o = acc[acctKey(h.broker, h.account)] ||= { v: 0, c: 0, n: 0, cash: null, today: 0 };
      o.v += h.valueKrw || 0; o.c += h.costKrw || 0; o.n++; o.today += h.dailyRate != null ? h.valueKrw - h.valueKrw / (1 + h.dailyRate / 100) : 0;
      continue;
    }
    const s = px[h.code]; if (!s) continue;
    const k = acctKey(h.broker, h.account), o = acc[k] ||= { v: 0, c: 0, n: 0, cash: null, today: 0 };
    const fx = h.currency === 'USD' ? (DATA.fx.USDKRW || 0) : 1;
    o.v += s.close * h.qty * fx; o.c += h.avg * h.qty * fx; o.n++;
    o.today += (s.close - s.close / (1 + s.changePct / 100)) * h.qty * fx;
  }
  for (const a of (AUTO.accounts || []).filter((a) => inAcct(acctKey(a.broker, a.account)))) { const o = acc[acctKey(a.broker, a.account)] ||= { v: 0, c: 0, n: 0, cash: null, today: 0 }; if (a.cash != null) o.cash = (o.cash || 0) + a.cash; }
  const keys = Object.keys(acc).sort((a, b) => acctName(a).localeCompare(acctName(b), 'ko'));
  if (keys.length < 2) return '';
  const tot = keys.reduce((t, k) => t + acc[k].v + (acc[k].cash || 0), 0);
  return `<section class="card" aria-labelledby="acs"><h2 id="acs" style="margin-bottom:10px">계좌별 현황</h2><div class="scroll"><table style="min-width:720px">
    <thead><tr><th scope="col">계좌</th><th scope="col">종목</th><th scope="col">주식 평가</th><th scope="col">예수금</th><th scope="col">평가손익</th><th scope="col">수익률</th><th scope="col">오늘</th><th scope="col">비중</th></tr></thead>
    <tbody>${keys.map((k) => { const o = acc[k], pl = o.v - o.c; return `<tr><td><button type="button" data-acct="${esc(k)}" style="height:auto;padding:4px 10px;font-weight:600">${esc(acctName(k))}</button></td><td class="num">${o.n}</td><td class="num">${won(o.v)}</td><td class="num">${o.cash == null ? '–' : won(o.cash)}</td><td class="num ${cls(pl)}">${signWon(pl)}</td><td class="num ${cls(pl)}">${o.c ? sign(pl / o.c * 100) : '–'}</td><td class="num ${cls(o.today)}">${signWon(o.today)}</td><td class="num">${tot ? ((o.v + (o.cash || 0)) / tot * 100).toFixed(0) + '%' : '–'}</td></tr>`; }).join('')}</tbody>

function chartSvg(c) {
  const W = 800, H = 380, top = 20, ph = 250, vTop = 290, vh = 70;
  const vals = [...c.close, ...c.ma20, ...c.ma60].filter((v) => v != null);
  const mn = Math.min(...vals), mx = Math.max(...vals), n = c.close.length;
  const X = (i) => (i / (n - 1)) * (W - 50), Y = (v) => top + (1 - (v - mn) / (mx - mn || 1)) * ph;
  const line = (arr, color, w) => `<polyline fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" points="${arr.map((v, i) => v == null ? '' : X(i).toFixed(1) + ',' + Y(v).toFixed(1)).filter(Boolean).join(' ')}"/>`;
  const vmax = Math.max(...c.volume), bw = Math.max(1, (W - 50) / n - 0.6);
  const vol = c.volume.map((v, i) => `<rect x="${X(i).toFixed(1)}" y="${(vTop + vh - v / vmax * vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${(v / vmax * vh).toFixed(1)}" fill="${i === n - 1 ? '#C8102E' : '#D6D6CF'}"/>`).join('');
  const grid = [0, .25, .5, .75, 1].map((t) => { const v = mn + (mx - mn) * (1 - t), y = top + t * ph; return `<line x1="0" y1="${y}" x2="${W - 50}" y2="${y}" stroke="#EFEFEA"/><text x="${W - 46}" y="${y + 4}" font-size="11" fill="#6B6B75">${v >= 1000 ? Math.round(v).toLocaleString('ko-KR') : v.toFixed(2)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 1년 종가와 20일·60일 이동평균선, 거래량 차트" style="display:block">${grid}${line(c.ma60, '#1D4ED8', 2)}${line(c.ma20, '#E8590C', 2)}${line(c.close, '#16161A', 2.2)}${vol}<text x="0" y="${vTop - 6}" font-size="11" fill="#6B6B75">거래량</text><text x="0" y="${H - 2}" font-size="11" fill="#6B6B75">${c.dates[0]}</text><text x="${W - 50}" y="${H - 2}" font-size="11" fill="#6B6B75" text-anchor="end">${c.dates[n - 1]}</text></svg>`;
}

// ================= 종목 상세 자료 · 팝업 · 상세 페이지 =================
const STOCKS = new Map();
async function loadStock(code) {
  if (STOCKS.has(code)) return STOCKS.get(code);
  const pr = fetch('data/stocks/' + encodeURIComponent(code) + '.json?t=' + (DATA?.updatedAt || '')).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  STOCKS.set(code, pr);
  return pr;
}
const numv = (v) => { const x = Number(String(v ?? '').replace(/[,+%배원억]/g, '')); return Number.isFinite(x) ? x : null; };
function latestActual(tbl, row) {
  if (!tbl) return {};
  const ps = tbl.periods.filter((p) => !p.est && numv(tbl.rows[row]?.[p.key]) != null);
  const cur = ps.at(-1), prev = ps.at(-2);
  const v = cur ? numv(tbl.rows[row][cur.key]) : null, pv = prev ? numv(tbl.rows[row][prev.key]) : null;
  return { v, period: cur?.title, yoy: v != null && pv ? (v / Math.abs(pv) - 1) * 100 * Math.sign(pv) : null };
}
function keyMetrics(d) {
  const sales = latestActual(d.annual, '매출액'), op = latestActual(d.annual, '영업이익'), roe = latestActual(d.annual, 'ROE');
  const eok = (v) => (v == null ? '–' : (Math.abs(v) >= 10000 ? (v / 10000).toFixed(1) + '조' : v.toLocaleString('ko-KR') + '억'));
  const yoy = (v) => (v == null ? '–' : `<span class="${cls(v)}">${sign(v).replace('.00', '')}</span>`);
  return [['시총', d.info?.['시총'] || '–'], ['매출', eok(sales.v)], ['매출YoY', yoy(sales.yoy)], ['영업이익', eok(op.v)], ['영익YoY', yoy(op.yoy)],
    ['PER', d.info?.PER || '–'], ['PBR', d.info?.PBR || '–'], ['ROE', roe.v == null ? '–' : roe.v.toFixed(1) + '%'], ['EPS', d.info?.EPS || '–']];
}
// 캔들 차트 (상승 빨강·하락 파랑), 선택: 이동평균선·거래량
function candleSvg(bars, { W = 520, H = 240, ma = [], volume = false, compact = false } = {}) {
  if (!bars?.length) return '<p class="mute">차트 자료가 없어요.</p>';
  const n = bars.length, R = compact ? 56 : 64, T = compact ? 22 : 12, VB = volume ? 56 : 0, B = 22;
  const all = bars.flatMap((b) => [b[2], b[3]]);
  const closes = bars.map((b) => b[4]);
  const mas = ma.map(([len, color]) => ({ color, vals: closes.map((_, i) => (i + 1 >= len ? closes.slice(i + 1 - len, i + 1).reduce((a, b2) => a + b2, 0) / len : null)) }));
  let mn = Math.min(...all), mx = Math.max(...all); const pad = (mx - mn) * 0.06 || 1; mn -= pad; mx += pad;
  const ph = H - T - B - VB, cw = (W - R) / n;
  const X = (i) => i * cw + cw / 2, Y = (v) => T + (1 - (v - mn) / (mx - mn)) * ph;
  const ticks = [0.15, 0.5, 0.85].map((t) => mn + (mx - mn) * (1 - t));
  const fmtp = (v) => (v >= 1000 ? Math.round(v).toLocaleString('ko-KR') : v.toFixed(2));
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 ${n}일 캔들 차트" style="display:block;background:${compact ? '#F2F2F5' : 'transparent'};border-radius:8px">`;
  svg += ticks.map((v) => `<line x1="0" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#E2E2E8" stroke-dasharray="3 3"/><text x="${W - R + 6}" y="${(Y(v) + 4).toFixed(1)}" font-size="11" fill="#6B6B75">${fmtp(v)}</text>`).join('');
  svg += `<line x1="${W - R}" x2="${W - R}" y1="${T}" y2="${T + ph}" stroke="#9A9AA5"/>`;
  const bw = Math.max(1, cw * 0.62);
  bars.forEach((b, i) => {
    const up = b[4] >= b[1], col = up ? '#E5303A' : '#2F6BEB', x = X(i);
    const yo = Y(b[1]), yc = Y(b[4]);
    svg += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y(b[2]).toFixed(1)}" y2="${Y(b[3]).toFixed(1)}" stroke="${col}"/><rect x="${(x - bw / 2).toFixed(1)}" y="${Math.min(yo, yc).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(yc - yo)).toFixed(1)}" fill="${col}"/>`;
  });
  for (const m of mas) svg += `<polyline fill="none" stroke="${m.color}" stroke-width="1.4" points="${m.vals.map((v, i) => (v == null ? '' : X(i).toFixed(1) + ',' + Y(v).toFixed(1))).filter(Boolean).join(' ')}"/>`;
  if (volume) {
    const vmax = Math.max(...bars.map((b) => b[5])) || 1, vy = T + ph + 8;
    bars.forEach((b, i) => { const h = b[5] / vmax * (VB - 10); svg += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${(vy + VB - 10 - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${b[4] >= b[1] ? '#F2A3A8' : '#A9C1F5'}"/>`; });
  }
  const step = Math.max(1, Math.round(n / 5));
  for (let i = 0; i < n; i += step) svg += `<text x="${X(i).toFixed(1)}" y="${H - 6}" font-size="11" fill="#6B6B75" text-anchor="middle">${bars[i][0].slice(5)}</text>`;
  if (compact) {
    const chg = (bars.at(-1)[4] / bars[0][4] - 1) * 100;
    svg += `<text x="6" y="16" font-size="12" fill="#6B6B75">최근 ${n}일</text><text x="${W - R - 4}" y="16" font-size="13" font-weight="700" text-anchor="end" fill="${chg >= 0 ? '#C8102E' : '#1D4ED8'}">${chg >= 0 ? '+' : ''}${chg.toFixed(1)}%</text>`;
  }
  return svg + '</svg>';
}

const $pop = document.getElementById('pop');

function hidePop() { $pop.style.display = 'none'; popCode = null; }
async function showPop(el) {
  const code = el.dataset.pop; popCode = code;
  const d = await loadStock(code);
  if (popCode !== code) return;
  const r = el.getBoundingClientRect();
  const name = d?.name || el.textContent.trim();
  $pop.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px"><b style="font-size:18px">${esc(name)} (${esc(code)})</b><button type="button" aria-label="닫기" onclick="hidePop()" style="height:32px;width:32px;padding:0;border:none;font-size:20px;color:var(--mute)">×</button></div>
    ${d ? `<div style="display:flex;gap:16px;align-items:stretch"><div style="flex:1;min-width:0">${candleSvg(d.bars.slice(-60), { W: 380, H: 220, compact: true })}</div><div class="pm">${keyMetrics(d).map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div></div><p class="mute" style="font-size:12px;margin:10px 0 0">클릭하면 상세 페이지로 이동해요</p>` : '<p class="mute" style="margin:0">아직 상세 자료가 없어요. (다음 장 마감 스캔 때 저장돼요)</p>'}`;
  $pop.style.display = 'block';
  const pw = $pop.offsetWidth, ph = $pop.offsetHeight;
  let left = r.right + 14, top = r.top + r.height / 2 - ph / 2;
  if (left + pw > innerWidth - 8) left = Math.max(8, r.left - pw - 14);
  top = Math.min(Math.max(8, top), innerHeight - ph - 8);
  $pop.style.left = left + 'px'; $pop.style.top = top + 'px';
}
if (matchMedia('(hover: hover)').matches) {
  document.addEventListener('mouseover', (e) => {

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${aria}" style="display:block">${grid}${lines}<text x="${L}" y="${H - 6}" font-size="11" fill="#6B6B75">${dates[0]}</text><text x="${W - R}" y="${H - 6}" font-size="11" fill="#6B6B75" text-anchor="end">${dates[n - 1]}</text></svg>`;
}
function barChart(labels, values, aria) {
  const W = 800, H = 260, T = 16, B = 30, n = labels.length;
  if (!n) return '<p class="mute">이 기간에 실현손익이 없어요.</p>';
  const mx = Math.max(1, ...values.map(Math.abs)), zero = values.some((v) => v < 0) ? (H - T - B) / 2 + T : H - B;
  const span = values.some((v) => v < 0) ? (H - T - B) / 2 : H - T - B, bw = Math.min(56, (W - 20) / n * 0.6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${aria}" style="display:block"><line x1="0" y1="${zero}" x2="${W}" y2="${zero}" stroke="#D6D6CF"/>${values.map((v, i) => {
    const cx = 10 + (i + 0.5) * (W - 20) / n, h = Math.abs(v) / mx * span, y = v >= 0 ? zero - h : zero;
    return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="3" fill="${v >= 0 ? '#C8102E' : '#1D4ED8'}"/><text x="${cx}" y="${(v >= 0 ? y - 4 : y + h + 12).toFixed(1)}" font-size="11" text-anchor="middle" fill="#3D3D45">${short(v)}</text><text x="${cx}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#6B6B75">${labels[i]}</text>`;
  }).join('')}</svg>`;
}

// ================= 자산 추이 (입출금 반영 시간가중수익률) =================
// 하루 입출금 추정: (오늘 총자산 − 어제 총자산) − Σ 어제 보유수량 × (오늘 종가 − 어제 종가)
// 매매·수수료 때문에 생기는 작은 차이는 입출금이 아닌 손익으로 봄(노이즈 기준 아래면 0)
const FLOW_NOISE = (prevTotal) => Math.max(50000, prevTotal * 0.003);
function rawFlow(prevA, curA) {
  let mkt = 0;
  for (const [code, [q, p0]] of Object.entries(prevA.pos || {})) { const p1 = curA.pos?.[code]?.[1] ?? p0; mkt += q * (p1 - p0); }
  return (curA.total - prevA.total) - mkt;
}
function accountFlow(prevA, curA, key, date) {
  const manual = (FLOWS?.rows || []).filter((f) => f.date === date && f.account === key);
  if (manual.length) return { flow: manual.reduce((t, f) => t + f.amount, 0), manual: true };
  if (!prevA) return { flow: 0, start: curA.total };               // 새로 생긴 계좌: 입금이 아니라 '계좌 추가'로
  // 입출금은 사용자가 알려준 것(직접 기록)만 반영 — 잔고 변화로 추정해서 넣지 않음
  return { flow: 0 };
}
// 기록 보정 (원본은 그대로 두고 화면 계산에만 사용)
//  1) 하루 자료가 빠진 계좌는 최대 5일까지 전날 값으로 채움 → 빠졌다 다시 생긴 계좌가 출금·입금으로 잡히지 않게
//  2) 매매 결제 시차(D+2): 산 날 주식은 늘고 예수금은 이틀 뒤 빠져서 '입금 → 며칠 뒤 같은 금액 출금'처럼 보이는 것을 찾아 상쇄
let ADJ = { src: null, days: [] };
function adjustedDays() {
  if (ADJ.src === HIST && ADJ.flows === FLOWS) return ADJ.days;
  const days = (HIST?.days || []).map((d) => ({ ...d, byAccount: d.byAccount ? Object.fromEntries(Object.entries(d.byAccount).map(([k, a]) => [k, { ...a }])) : null }));
  const last = {};
  for (const d of days) {
    if (!d.byAccount) continue;
    // 같은 증권사에 처음 보는 계좌가 생긴 날은 이름이 바뀐 것일 수 있어 채우지 않음 (두 번 세지 않게)
    const newBrokers = new Set(Object.keys(d.byAccount).filter((k) => !last[k]).map((k) => k.split('|')[0]));
    for (const [k, v] of Object.entries(last)) if (!d.byAccount[k] && v.age < 5 && !newBrokers.has(k.split('|')[0])) d.byAccount[k] = { ...v.a, stale: true };
    for (const [k, a] of Object.entries(d.byAccount)) last[k] = { a, age: a.stale ? (last[k]?.age || 0) + 1 : 0 };
  }
  const keys = new Set(days.flatMap((d) => Object.keys(d.byAccount || {})));
  for (const k of keys) {
    const fl = [];
    for (let i = 1; i < days.length; i++) {
      const a = days[i].byAccount?.[k], pa = days[i - 1].byAccount?.[k];
      if (!a || !pa?.pos || (FLOWS?.rows || []).some((f) => f.date === days[i].date && f.account === k)) continue;
      const raw = rawFlow(pa, a);
      if (Math.abs(raw) >= FLOW_NOISE(pa.total)) fl.push({ i, raw });
    }
    const used = new Set();
    for (let x = 0; x < fl.length; x++) {
      if (used.has(x)) continue;
      for (let y = x + 1; y < fl.length && fl[y].i - fl[x].i <= 4; y++) {
        if (used.has(y)) continue;
        const a = fl[x].raw, b = fl[y].raw;
        if (a * b < 0 && Math.abs(a + b) <= Math.max(50000, 0.05 * Math.max(Math.abs(a), Math.abs(b)))) {
          for (let i = fl[x].i; i < fl[y].i; i++) { const acc = days[i].byAccount[k]; acc.total -= a; acc.settle = true; }
          used.add(x); used.add(y); break;
        }
      }
    }
  }
  ADJ = { src: HIST, flows: FLOWS, days };
  return days;
}
function twrSeries() {
  const days = adjustedDays();
  const out = [];
  for (let i = 0; i < days.length; i++) {
    const d = days[i], p = days[i - 1];
    const keys = Object.keys(d.byAccount || {}).filter(inAcct);
    let V = 0, Vp = 0, F = 0, S = 0, has = false, flags = { manual: false, inferred: false, unknown: false, settle: false, start: false };
    if (!d.byAccount) { if (!isAll()) continue; V = d.total; Vp = p ? p.total : null; F = 0; has = true; flags.unknown = !!p; }
    else {
      for (const k of keys) {
        const a = d.byAccount[k]; if (!a) continue; has = true;
        const pa = p?.byAccount?.[k];
        V += a.total; if (pa) Vp += pa.total;
        flags.settle ||= !!a.settle;
        if (!p) continue;
        const f = accountFlow(pa, a, k, d.date);
        F += f.flow; if (f.start) { S += f.start; flags.start = true; }
        flags.manual ||= f.manual; flags.inferred ||= f.inferred; flags.unknown ||= f.unknown;
      }
    }
    if (!has) continue;
    if (!p) { out.push({ date: d.date, V, F: 0, S: 0, pnl: 0, r: null, d, flags }); continue; }
    if (p && !p.byAccount && d.byAccount) Vp = p.total;
    const pnl = V - Vp - F - S;
    const base = Vp + Math.max(F, 0);
    out.push({ date: d.date, V, F, S, pnl, r: base > 0 ? pnl / base : null, d, flags, ...(isAll() || !d.byAccount ? { cash: d.cash, stockValue: d.stockValue, cost: d.cost } : (() => { const ks = keys.filter((k) => d.byAccount[k]); const sum = (f) => ks.reduce((t, k) => t + (d.byAccount[k][f] || 0), 0); return { cash: ks.some((k) => d.byAccount[k].cash != null) ? sum('cash') : null, stockValue: sum('stockValue'), cost: sum('cost') }; })()) });
  }
  return out;
}

let REAL_BROKER = 'all';
const acctLabel = (broker, account) => acctName(acctKey(broker, account));

  <section class="cards" aria-label="실현손익 요약">
    <div class="card kpi dark"><div class="l">순 실현손익</div><div class="v num">${signWon(net)}<span style="font-size:16px;color:#C9C9D1"> 원</span></div><div class="s">매입원금 대비 <b>${rateOf(net, basis) == null ? '–' : sign(rateOf(net, basis))}</b> · 실현손익 ${signWon(gross)} − 수수료·세금</div></div>
    <div class="card kpi"><div class="l">수수료 + 세금</div><div class="v num">${won(costs)}<span class="mute" style="font-size:16px"> 원</span></div><div class="s mute">매도금액 대비 ${sell ? (costs / sell * 100).toFixed(2) : '0.00'}%</div></div>
    <div class="card kpi"><div class="l">매도 건수 · 승률</div><div class="v num">${rows.length}<span class="mute" style="font-size:16px"> 건</span></div><div class="s mute">이익 ${wins}건 · 승률 ${rows.length ? (wins / rows.length * 100).toFixed(0) : 0}%</div></div>
    <div class="card kpi"><div class="l">총 매도금액</div><div class="v num">${short(sell)}<span class="mute" style="font-size:16px"> 원</span></div><div class="s mute">${esc(f === '2000-01-01' ? '전체 기간' : f + ' ~ ' + t)}</div></div>
  </section>
  <section class="card" aria-labelledby="r1"><h2 id="r1" style="margin-bottom:12px">월별 순 실현손익</h2>${barChart(mKeys.map((m) => m.slice(2).replace('-', '.')), mKeys.map((m) => months[m]), '월별 순 실현손익 막대 그래프')}</section>
  <div class="row">
    <section class="card" style="flex:1 1 460px;min-width:0" aria-labelledby="r2">
      <h2 id="r2" style="margin-bottom:10px">종목별</h2>
      <div class="scroll" style="max-height:480px;overflow-y:auto"><table>
        <thead><tr><th scope="col">종목</th><th scope="col">매도금액</th><th scope="col">순손익</th><th scope="col">수익률</th></tr></thead>
        <tbody>${stocks.length ? stocks.map((s) => { const rr = rateOf(s.net, s.sell - s.gross); return `<tr><td><span class="name">${esc(s.name)}</span><div class="sub">${esc(s.code)} · ${s.n}건 · ${s.qty.toLocaleString('ko-KR')}주</div></td><td class="num">${short(s.sell)}</td><td class="num ${cls(s.net)}">${signWon(s.net)}</td><td class="num ${cls(rr)}">${rr == null ? '–' : sign(rr)}</td></tr>`; }).join('') : '<tr><td colspan="4" class="mute">내역이 없어요</td></tr>'}</tbody>
      </table></div>
    </section>
    <section class="card" style="flex:999 1 560px;min-width:0" aria-labelledby="r3">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 id="r3">매도 내역</h2><button type="button" id="rcsv" style="height:36px">CSV 내려받기</button></div>
      <div class="scroll" style="max-height:480px;overflow-y:auto"><table style="min-width:720px">
        <thead><tr><th scope="col">날짜</th><th scope="col" style="text-align:left">종목</th><th scope="col">수량</th><th scope="col">매입단가</th><th scope="col">매도금액</th><th scope="col">실현손익</th><th scope="col">수익률</th><th scope="col">비용</th></tr></thead>
        <tbody>${rows.length ? rows.map((r) => `<tr><td class="num">${esc(r.date)}</td><td style="text-align:left">${esc(r.name)}<div class="sub">${esc(acctLabel(r.broker, r.account))}</div></td><td class="num">${r.qty.toLocaleString('ko-KR')}</td><td class="num">${won(r.buyPrice)}</td><td class="num">${won(r.sellAmt)}</td><td class="num ${cls(r.pl)}">${signWon(r.pl)}</td><td class="num ${cls(r.rate)}">${sign(r.rate)}</td><td class="num mute">${won(r.fee + r.tax)}</td></tr>`).join('') : '<tr><td colspan="8" class="mute">이 기간에 매도 내역이 없어요</td></tr>'}</tbody>
      </table></div>
      <p class="mute" style="font-size:12px;margin:10px 0 0">실현손익·수익률은 증권사가 계산한 값이에요. 순손익 = 실현손익 − 수수료 − 세금. 증권사마다 계산 방식이 조금 다를 수 있어요.</p>
    </section>
  </div>`;
  bindPeriod();
  bindAcct();
  document.getElementById('rcsv').onclick = () => csvDownload(`실현손익_${f}_${t}.csv`, ['날짜', '증권사', '계좌', '종목코드', '종목명', '수량', '매입단가', '매도금액', '실현손익', '수익률', '수수료', '세금', '순손익'], rows.map((r) => [r.date, r.broker, r.account, r.code, r.name, r.qty, r.buyPrice, r.sellAmt, r.pl, r.rate, r.fee, r.tax, r.net]));
}

// ================= 매매 신호 (추세추종 Stage) =================
function viewSignals() {
  if (!SIG) { $app.innerHTML = '<h1>매매 신호</h1><div class="card"><p class="mute" style="margin:0">아직 스캔 결과가 없어요. 평일 장 마감 후(16:55)에 첫 스캔이 실행돼요.</p></div>'; return; }
  const C = SIG.criteria || {}, R = C.risk || {};
  // 2% 룰 수량: 추세추종 계좌(strategy.json risk.capitalAccount, 예 한투2) 총액 기준
  const capName = R.capitalAccount || null;
  const lastDay = HIST?.days?.at(-1);
  const capKey = capName && lastDay?.byAccount ? Object.keys(lastDay.byAccount).find((k) => acctName(k) === capName) : null;
  const total = capName ? (capKey ? lastDay.byAccount[capKey].total : null) : (lastDay?.total || null);
  const qty = (entry, stop) => total && entry > stop ? Math.floor(total * (R.riskPerTradePct || 2) / 100 / (entry - stop)) : null;
  const flags = (s) => [s.base?.tight && '<span class="tag up">변동성 수축</span>', s.base?.volDry && '<span class="tag">거래량 감소</span>', s.flow && (s.flow.positive ? '<span class="tag up">외인·기관 +</span>' : '<span class="tag near-stop">외인·기관 −</span>')].filter(Boolean).join(' ');
  const nm = (s) => `${popName(s.code, s.name)}<div class="sub">${esc(s.code)} · ${esc(s.market)} · 시총 ${(s.capEok || 0) >= 10000 ? ((s.capEok || 0) / 10000).toFixed(1) + '조' : Math.round(s.capEok || 0).toLocaleString('ko-KR') + '억'}</div>`;
  const alerts = SIG.intraday?.alerts || [];
  const planCells = (entry, p) => `<td class="num down">${won(p?.stop)}<div class="sub">${p?.stopPct ?? ''}%</div></td><td class="num up">${won(p?.target)}<div class="sub">+${p?.targetPct ?? ''}%</div></td>${total ? `<td class="num">${qty(entry, p?.stop)?.toLocaleString('ko-KR') ?? '–'}주</td>` : ''}`;
  const qtyHead = total ? `<th scope="col">${R.riskPerTradePct || 2}% 룰 수량</th>` : '';

  $app.innerHTML = `
  ${SIG.sample ? '<div class="banner">샘플 스캔 결과예요. 실제 스캔은 평일 장 마감 후 실행돼요.</div>' : ''}
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px">
    <div><h1>매매 신호 · 추세추종</h1><p class="mute" style="margin:4px 0 0">기준일 ${esc(SIG.asOf)} · 시총 ${C.minMarketCapEok?.toLocaleString('ko-KR')}억 이상 ${SIG.universe}종목 중 분석 ${SIG.analyzed}종목 · RS ${C.minRS} 이상</p></div>
    <span class="mute" style="font-size:13px">장중 10분마다 돌파 감시 · 텔레그램 알림</span>
  </div>
  <section class="cards" aria-label="요약">
    <div class="card kpi dark"><div class="l">3 Stage 돌파 (오늘)</div><div class="v num">${SIG.breakouts.length + alerts.filter((a) => !SIG.breakouts.some((b) => b.code === a.code)).length}<span style="font-size:16px;color:#C9C9D1"> 종목</span></div><div class="s">장중 알림 ${alerts.length} · 종가 확인 ${SIG.breakouts.length}</div></div>
    <div class="card kpi"><div class="l">2 Stage 관찰 (돌파 대기)</div><div class="v num">${SIG.stage2.length}<span class="mute" style="font-size:16px"> 종목</span></div><div class="s mute">피벗 아래 ${C.watchWithinPct}% 이내 베이스</div></div>
    <div class="card kpi"><div class="l">1 Stage (신고가·정배열)</div><div class="v num">${SIG.stage1.length}<span class="mute" style="font-size:16px"> 종목</span></div><div class="s mute">최근 10일 내 52주 신고가</div></div>
    <div class="card kpi"><div class="l">리스크 규칙</div><div class="v num" style="font-size:22px">최대 ${R.riskPerTradePct}% · 1:${R.rewardRisk}</div><div class="s mute">${total ? `${capName ? esc(capName) + ' 총액' : '총자산'} ${short(total)} 기준 수량 계산` : HIST ? `${esc(capName || '')} 계좌 자료가 없어요` : '잔고 잠금 해제 시 수량 계산'}</div></div>
  </section>

  <section class="card" aria-labelledby="sg1">
    <h2 id="sg1" style="margin-bottom:10px">🚀 3 Stage 돌파</h2>
    ${alerts.length ? `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">${alerts.map((a) => `<div class="sig"><span class="dot"></span><span><b>${esc(a.name)}</b> ${esc(a.time)} 장중 돌파 · ${won(a.price)}원 (피벗 ${won(a.pivot)}) · 거래량 ${a.volRatio}배 · RS ${a.rs}</span></div>`).join('')}</div>` : ''}
    <div class="scroll"><table style="min-width:820px">
      <thead><tr><th scope="col">종목</th><th scope="col">종가</th><th scope="col">피벗</th><th scope="col">거래량</th><th scope="col">RS</th><th scope="col" style="text-align:left">베이스 · 신호</th><th scope="col">손절</th><th scope="col">목표</th>${qtyHead}</tr></thead>
      <tbody>${SIG.breakouts.length ? SIG.breakouts.map((s) => `<tr><td>${nm(s)}</td><td class="num">${won(s.price)}</td><td class="num">${won(s.pivot)}<div class="sub up">+${(s.price / s.pivot * 100 - 100).toFixed(1)}%</div></td><td class="num">${s.volRatio}배</td><td class="num">${s.rs}</td><td style="text-align:left;white-space:normal">${s.base.days}일 · 조정 ${s.base.depthPct}%<div style="margin-top:4px">${flags(s)}</div></td>${planCells(s.price, s.plan)}</tr>`).join('') : `<tr><td colspan="${total ? 9 : 8}" class="mute">종가 기준 돌파 종목이 없어요.</td></tr>`}</tbody>
    </table></div>
  </section>

  <section class="card" aria-labelledby="sg2">
    <h2 id="sg2" style="margin-bottom:4px">👀 2 Stage 관찰 — 다음 돌파 감시 목록</h2>
    <p class="mute" style="margin:0 0 10px;font-size:13px">피벗(베이스 고점)을 거래량 ${C.breakout?.volumeRatio}배 이상 동반해 넘으면 장중 알림이 가요. 피벗에 가까운 순.</p>
    <div class="scroll" style="max-height:560px;overflow-y:auto"><table style="min-width:880px">
      <thead><tr><th scope="col">종목</th><th scope="col">현재가</th><th scope="col">피벗</th><th scope="col">피벗까지</th><th scope="col">RS</th><th scope="col" style="text-align:left">베이스 · 신호</th><th scope="col">손절</th><th scope="col">목표</th>${qtyHead}</tr></thead>
      <tbody>${SIG.stage2.length ? SIG.stage2.map((s) => `<tr><td>${nm(s)}</td><td class="num">${won(s.price)}</td><td class="num">${won(s.pivot)}</td><td class="num">${s.toPivotPct}%</td><td class="num">${s.rs}</td><td style="text-align:left;white-space:normal">${s.base.days}일 · 조정 ${s.base.depthPct}% · 직전 상승 ${s.base.advancePct}%<div style="margin-top:4px">${flags(s)}</div></td>${planCells(s.pivot, s.plan)}</tr>`).join('') : `<tr><td colspan="${total ? 9 : 8}" class="mute">조건에 맞는 베이스가 없어요.</td></tr>`}</tbody>
    </table></div>
  </section>

  <div class="row">
    <section class="card" style="flex:1 1 420px;min-width:0" aria-labelledby="sg3">
      <h2 id="sg3" style="margin-bottom:10px">1 Stage — 신고가 + 정배열 (RS 순)</h2>
      <ul class="list">${SIG.stage1.length ? SIG.stage1.slice(0, 20).map((s) => `<li style="display:flex;justify-content:space-between;gap:8px"><span>${popName(s.code, s.name)} <span class="mute" style="font-size:12px">${esc(s.code)}</span><br><span class="mute" style="font-size:12px">3개월 ${sign(s.ret3m)} · 신고가 ${s.daysSince52wHigh}일 전</span></span><span class="num">RS ${s.rs}</span></li>`).join('') : '<li class="mute">없어요</li>'}</ul>
    </section>
    <section class="card" style="flex:1 1 420px;min-width:0" aria-labelledby="sg4">
      <h2 id="sg4" style="margin-bottom:10px">알림 기록</h2>
      <div class="scroll" style="max-height:420px;overflow-y:auto"><table>
        <thead><tr><th scope="col">날짜</th><th scope="col" style="text-align:left">종목</th><th scope="col">가격</th><th scope="col">거래량</th></tr></thead>
        <tbody>${(SIG.history || []).length ? SIG.history.slice(0, 60).map((h) => `<tr><td class="num">${esc(h.date)} ${esc(h.time || '종가')}</td><td style="text-align:left">${popName(h.code, h.name)}</td><td class="num">${won(h.price)}</td><td class="num">${h.volRatio}배</td></tr>`).join('') : '<tr><td colspan="4" class="mute">아직 알림이 없어요</td></tr>'}</tbody>
      </table></div>
    </section>
  </div>

  <section class="card" aria-labelledby="sg5">
    <h2 id="sg5" style="margin-bottom:10px">스캔 기준 (내 추세추종 원칙 반영)</h2>
    <div class="grid2" style="gap:6px 32px;font-size:14px">
      <div><b>1 Stage</b> — 종가 &gt; 50일 &gt; 150일 &gt; 200일선(정배열, 200일선 상승), 52주 고가 대비 −${C.trend?.maxBelow52wHighPct}% 이내, RS ${C.minRS}+</div>
      <div><b>2 Stage</b> — 52주 고가(피벗) 이후 ${C.base?.minDays}~${C.base?.maxDays}거래일 조정, 직전 상승 ${C.base?.minPriorAdvancePct}%+, 조정폭 ≤ 상승폭의 ${Math.round((C.base?.maxDepthOfAdvance || 0.5) * 100)}% · ${C.base?.maxDepthPct}% 이내</div>
      <div><b>3 Stage</b> — 피벗 돌파 + 거래량 50일 평균의 ${C.breakout?.volumeRatio}배 이상, 피벗 +${C.breakout?.maxExtendedPct}% 이내만</div>
      <div><b>리스크</b> — 손절은 최근 저점 또는 −${R.maxStopPct}% 중 가까운 쪽, 목표 1:${R.rewardRisk}, 1회 손실 ${capName ? esc(capName) + ' 계좌 총액' : '총자산'}의 ${R.riskPerTradePct}%</div>
      <div><b>RS</b> — 3·6·9·12개월 가중 수익률의 대상 종목 내 백분위(1~99)</div>
      <div><b>수급</b> — 외국인+기관 최근 20일 순매수(한국투자증권 API)</div>
    </div>
    <p class="mute" style="font-size:12px;margin:12px 0 0">펀더멘털(실적·구조적 성장), 내러티브, 섹터 ETF 20일선은 자동 판단하지 않아요. 신호가 오면 직접 확인하세요. 기준값은 GitHub의 config/strategy.json에서 바꿀 수 있어요. 투자 판단과 책임은 본인에게 있어요.</p>
  </section>`;
}

function route() {
  if (!DATA) return;
  const hsh = location.hash || '#/';
  document.getElementById('nav-home').className = hsh === '#/' ? 'on' : '';
  document.getElementById('nav-hold').className = hsh === '#/holdings' ? 'on' : '';
  document.getElementById('nav-hist').className = hsh === '#/history' ? 'on' : '';
  document.getElementById('nav-real').className = hsh === '#/realized' ? 'on' : '';
  document.getElementById('nav-sig').className = hsh === '#/signals' ? 'on' : '';
  if (hsh.startsWith('#/stock/')) viewStock(decodeURIComponent(hsh.slice(8)));
  else if (hsh === '#/history') viewHistory();
  else if (hsh === '#/realized') viewRealized();
  else if (hsh === '#/signals') viewSignals();
  else if (hsh === '#/holdings') viewHoldings();
  else viewHome();
  window.scrollTo(0, 0);
}

fetch('data/summary.json?t=' + Date.now())
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(async (d) => {
    DATA = d;
    const getJ = async (f) => { try { const r = await fetch('data/' + f + '?t=' + Date.now()); return r.ok ? await r.json() : null; } catch { return null; } };
    [ENC, ENC_H, ENC_R, SIG, ENC_F] = await Promise.all([getJ('holdings.enc.json'), getJ('history.enc.json'), getJ('realized.enc.json'), getJ('signals.json'), getJ('flows.enc.json')]);
    const pw = savedPw();
    if (ENC && pw) { try { await unlock(pw, !!localStorage.getItem('stocknote.pw')); } catch { AUTO = null; } }
    route();
  })
  .catch((e) => { $app.innerHTML = `<div class="banner err">data/summary.json 을 불러오지 못했어요 (${esc(e.message)}). GitHub Actions가 한 번 실행됐는지 확인해 주세요.</div>`; });
window.addEventListener('hashchange', route);
</script>
</body>
</html>
