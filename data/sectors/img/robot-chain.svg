<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" role="img" aria-label="돈은 관절 부품에서 먼저 돈다 — 로봇 밸류체인" font-size="12" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect width="760" height="508" fill="#fff"/><defs><marker id="vc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A9AA3"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#16161A">돈은 관절 부품에서 먼저 돈다 — 로봇 밸류체인</text><rect x="24" y="60" width="296" height="400" rx="8" fill="none" stroke="#9A9AA3"/><text x="40" y="84" font-size="13" font-weight="600" fill="#16161A">부품·AI — 돈이 먼저 도는 곳</text><rect x="40" y="92" width="264" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9AA3" stroke-width="1.25"/><text x="56" y="116" font-size="13" font-weight="600" fill="#16161A">두뇌: AI 모델·칩</text><text x="56" y="132" fill="#16161A">엔비디아 · 구글 딥마인드 · 테슬라</text><text x="56" y="148" fill="#5C5C66">Figure Helix · 삼성전자</text><rect x="40" y="180" width="264" height="88" rx="8" fill="#1D4ED8" fill-opacity="0.12" stroke="#1D4ED8" stroke-width="2"/><text x="56" y="204" font-size="13" font-weight="600" fill="#16161A">관절: 감속기·모터·액추에이터</text><text x="56" y="220" fill="#16161A">HDS · 나부테스코 · 리더드라이브</text><text x="56" y="236" fill="#16161A">에스피지 · 에스비비테크 (감속기)</text><text x="56" y="252" fill="#16161A">로보티즈 · 현대모비스 · 삼현</text><rect x="40" y="284" width="264" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9AA3" stroke-width="1.25"/><text x="56" y="308" font-size="13" font-weight="600" fill="#16161A">손·촉각 센서</text><text x="56" y="324" fill="#16161A">테슬라 22자유도 손 · 샤르파</text><text x="56" y="340" fill="#5C5C66">로보티즈 (2~5지 로봇 손)</text><rect x="40" y="372" width="264" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9AA3" stroke-width="1.25"/><text x="56" y="396" font-size="13" font-weight="600" fill="#16161A">선형 구동·베어링</text><text x="56" y="412" fill="#16161A">THK · NSK (볼·롤러 스크류)</text><text x="56" y="428" fill="#5C5C66">삼익THK</text><rect x="352" y="60" width="232" height="400" rx="8" fill="none" stroke="#9A9AA3"/><text x="368" y="84" font-size="13" font-weight="600" fill="#16161A">완성품 — 아직 적자·고밸류</text><rect x="368" y="172" width="200" height="88" rx="8" fill="none" fill-opacity="1" stroke="#9A9AA3" stroke-width="1.25"/><text x="384" y="196" font-size="13" font-weight="600" fill="#16161A">휴머노이드</text><text x="384" y="212" fill="#16161A">테슬라 · Figure</text><text x="384" y="228" fill="#16161A">유니트리 · 보스턴다이내믹스</text><text x="384" y="244" fill="#5C5C66">레인보우로보틱스 (삼성)</text><rect x="368" y="276" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9AA3" stroke-width="1.25"/><text x="384" y="300" font-size="13" font-weight="600" fill="#16161A">협동·산업용 로봇</text><text x="384" y="316" fill="#16161A">두산로보틱스 · 레인보우</text><text x="384" y="332" fill="#5C5C66">뉴로메카 · 로보스타</text><rect x="616" y="60" width="120" height="400" rx="8" fill="none" stroke="#9A9AA3"/><text x="632" y="84" font-size="13" font-weight="600" fill="#16161A">수요처</text><text x="632" y="208" fill="#16161A">자동차 공장</text><text x="632" y="232" fill="#16161A">조선소 용접</text><text x="632" y="256" fill="#16161A">반도체 팹</text><text x="632" y="280" fill="#16161A">물류 창고</text><text x="632" y="304" fill="#16161A">방산 (4족)</text><g fill="none" stroke="#9A9AA3" stroke-width="1.25"><path d="M320 260H352" marker-end="url(#vc-arrow)"/><path d="M584 260H616" marker-end="url(#vc-arrow)"/></g><text x="24" y="484" fill="#5C5C66">강조 칸 = 양산의 병목. 완성품이 몇 대를 팔든 관절 부품은 대당 25~50개씩 반복 발주된다.</text></svg>