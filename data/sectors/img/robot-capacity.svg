<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="발표된 생산능력 목표는 2025년 실제 생산량의 최대 700배가 넘는다" font-size="12" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect width="760" height="320" fill="#fff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#16161A">발표된 생산능력 목표는 2025년 실제 생산량의 최대 700배가 넘는다</text><text x="24" y="48" font-size="11.5" fill="#5C5C66">연간 대수, 로그 눈금 · 최대 목표는 실제 생산의 약 741배</text><line x1="279.2786622939921" x2="279.2786622939921" y1="84" y2="270" stroke="#EFEFEA"/><text x="279.2786622939921" y="290" text-anchor="middle" font-size="11.5" fill="#5C5C66">1만 대</text><line x1="409.75955409799735" x2="409.75955409799735" y1="84" y2="270" stroke="#EFEFEA"/><text x="409.75955409799735" y="290" text-anchor="middle" font-size="11.5" fill="#5C5C66">10만 대</text><line x1="540.2404459020026" x2="540.2404459020026" y1="84" y2="270" stroke="#EFEFEA"/><text x="540.2404459020026" y="290" text-anchor="middle" font-size="11.5" fill="#5C5C66">100만 대</text><line x1="670.721337706008" x2="670.721337706008" y1="84" y2="270" stroke="#EFEFEA"/><text x="670.721337706008" y="290" text-anchor="middle" font-size="11.5" fill="#5C5C66">1,000만 대</text><line x1="296.2847286393973" x2="296.2847286393973" y1="80" y2="270" stroke="#8A8A93" stroke-width="1.25" stroke-dasharray="4 4"/><text x="302.2847286393973" y="78" font-size="11.5" fill="#5C5C66">2025년 전 세계 실제 생산(추정) 1.35만 대</text><text x="24" y="116" fill="#16161A">Figure BotQ 초기 케파</text><line x1="296.2847286393973" x2="289.6103018924386" y1="112" y2="112" stroke="#B8B8C0" stroke-width="1.25"/><circle cx="289.6103018924386" cy="112" r="6" fill="#B8B8C0"/><text x="301.6103018924386" y="116" fill="#16161A">1.2만 대</text><text x="24" y="160" fill="#16161A">현대차 아틀라스 공장(계획)</text><line x1="296.2847286393973" x2="341.5338691084596" y1="156" y2="156" stroke="#B8B8C0" stroke-width="1.25"/><circle cx="341.5338691084596" cy="156" r="6" fill="#B8B8C0"/><text x="353.5338691084596" y="160" fill="#16161A">3만 대</text><text x="24" y="204" fill="#16161A">테슬라 프리몬트 라인</text><line x1="296.2847286393973" x2="540.2404459020026" y1="200" y2="200" stroke="#B8B8C0" stroke-width="1.25"/><circle cx="540.2404459020026" cy="200" r="6" fill="#B8B8C0"/><text x="552.2404459020026" y="204" fill="#16161A">100만 대</text><text x="24" y="248" fill="#16161A">테슬라 텍사스 공장(목표)</text><line x1="296.2847286393973" x2="670.721337706008" y1="244" y2="244" stroke="#B8B8C0" stroke-width="1.25"/><circle cx="670.721337706008" cy="244" r="6" fill="#1D4ED8"/><text x="682.721337706008" y="248" fill="#16161A" font-weight="600">1,000만 대</text><text x="24" y="312" font-size="11" fill="#5C5C66">모두 회사가 밝힌 목표·계획치다. 2025년 실제 생산은 중국 11,568대가 86%라는 수치로 역산했다.</text></svg>